name: Build & Release FileRoute Android 17 APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API 37)
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.2

      - name: Point compileSdk 37 at platform 37.2
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ ! -d "$SDK/platforms/android-37" ]; then
            ln -s android-37.2 "$SDK/platforms/android-37"
          fi
          cat "$SDK/platforms/android-37/source.properties"

      - name: Setup Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Prepare Release APK Filename
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-dev}"
          cp app/build/outputs/apk/debug/app-debug.apk "FileRoute-${TAG_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileRoute-android17-debug-apk
          path: FileRoute-*.apk

      - name: Publish GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: FileRoute-*.apk
