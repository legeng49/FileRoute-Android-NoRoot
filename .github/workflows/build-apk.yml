name: Build FileRoute Android 17 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API 37)
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.2

      - name: Point compileSdk 37 at platform 37.2
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ ! -d "$SDK/platforms/android-37" ]; then
            ln -s android-37.2 "$SDK/platforms/android-37"
          fi
          cat "$SDK/platforms/android-37/source.properties"

      - name: Setup Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk FileRoute-v3.0.0-android17-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileRoute-android17-debug-apk
          path: FileRoute-v3.0.0-android17-debug.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<'EOF'
          v3.0.0。规则增至 10 条（8 条公共目录监听 + 2 条分享归位）。

          - 通知可打开源文件夹
          - 继续全盘扫描 MediaStore 与 Download、Pictures
          - 首页、规则、历史撤销、路径诊断
          - 圆角程序图标

          最低系统 Android 8.0（API 26）。安装包：FileRoute-v3.0.0-android17-debug.apk
          EOF
          )
          if gh release view "v3.0.0-android17" >/dev/null 2>&1; then
            gh release upload "v3.0.0-android17" "FileRoute-v3.0.0-android17-debug.apk" --clobber
          else
            gh release create "v3.0.0-android17" "FileRoute-v3.0.0-android17-debug.apk" \
              --title "归位 FileRoute v3.0.0（Android 17）" \
              --notes "$notes" \
              --latest
          fi
