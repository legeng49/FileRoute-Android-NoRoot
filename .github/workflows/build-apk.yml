name: Build FileRoute Android 17 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android 17 Platform (API 37)
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37"

      - name: Setup Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk FileRoute-v2.0.0-android17-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileRoute-android17-debug-apk
          path: FileRoute-v2.0.0-android17-debug.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<'EOF'
          适配 Android 17（API 37，targetSdk 37）。v1.0.0 仅适配到 Android 15（API 35）。

          - dataSync 前台服务超时后交给 WorkManager 与 MediaStore 触发
          - 归位后立即扫描媒体库
          - 大屏与平板自适应布局
          - Edge-to-edge 与预测性返回

          最低系统 Android 8.0（API 26）。安装包：FileRoute-v2.0.0-android17-debug.apk
          EOF
          )
          if gh release view "v2.0.0-android17" >/dev/null 2>&1; then
            gh release upload "v2.0.0-android17" "FileRoute-v2.0.0-android17-debug.apk" --clobber
          else
            gh release create "v2.0.0-android17" "FileRoute-v2.0.0-android17-debug.apk" \
              --title "归位 FileRoute v2.0.0（Android 17）" \
              --notes "$notes" \
              --latest
          fi
