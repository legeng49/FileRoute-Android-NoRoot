name: Build FileRoute Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk FileRoute-v1.0.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileRoute-debug-apk
          path: FileRoute-v1.0.0-debug.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v1.0.0" >/dev/null 2>&1; then
            gh release upload "v1.0.0" "FileRoute-v1.0.0-debug.apk" --clobber
          else
            gh release create "v1.0.0" "FileRoute-v1.0.0-debug.apk" \
              --title "归位 FileRoute v1.0.0" \
              --notes "调试版 APK，下载后可直接安装到手机。" \
              --latest
          fi
